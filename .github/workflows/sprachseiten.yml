# Objektor · Sprachseiten automatisch bauen (09.11.2026)
# Sobald index.html oder ein Woerterbuch (sprache-*.js) online geht, baut GitHub daraus
# en/index.html und sitemap.xml neu und stellt sie online. Niemand muss daran denken.
name: Sprachseiten bauen
on:
  push:
    branches: [main]
    paths: ['index.html', 'sprache.js', 'sprache-*.js', 'werkzeuge/sprachseiten.js']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: sprachseiten
  cancel-in-progress: false
jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sprachseiten bauen
        run: node werkzeuge/sprachseiten.js
      - name: Online stellen, falls sich etwas geaendert hat
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A en sitemap.xml index.html
          if git diff --cached --quiet; then echo "Sprachseiten schon aktuell"; exit 0; fi
          git commit -m "Sprachseiten neu gebaut (automatisch)"
          git pull --rebase origin main
          git push origin HEAD:main
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages baut von selbst"
